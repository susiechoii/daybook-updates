<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook Updates</title>
<style>
:root { --bg: #f7f6f3; --card: #fff; --fg: #1f1f1d; --muted: #6b6a66; --line: #e4e2dc; --accent: #2f6fde; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #1b1b1a; --card: #242423; --fg: #ecebe8; --muted: #a09f9a; --line: #383735; --accent: #7aa7f5; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
main { max-width: 620px; margin: 0 auto; padding: 48px 16px; }
h1 { margin: 0 0 4px; font-size: 26px; }
.sub { color: var(--muted); margin: 0 0 28px; }
ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
li:first-child { border-color: var(--accent); }
li span { color: var(--muted); font-size: 13px; margin-left: 6px; }
li p { margin: 4px 0 0; }
</style></head>
<body><main>
<h1>Daybook</h1>
<p class="sub">Latest version 1.2.0. Daybook installs updates on its own; nothing to download here.</p>
<ul>
<li><b>1.2.0</b> <span>2026-10-21</span><p>First version that updates itself.</p></li>
</ul>
</main></body></html>
